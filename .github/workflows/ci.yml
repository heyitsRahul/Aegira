name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      # The suite includes the invariant-enforcement tests: exhaustive
      # state machine coverage, privacy-negative payload assertions, and
      # the retention-class check over migrations (invariant 8).
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
