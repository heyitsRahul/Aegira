<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Sahay</title>
<script>
// Older browsers (Opera Mini, KaiOS, old stock Android) lack what this
// app needs; hand them the zero-JS version instead of a blank screen.
if (!window.fetch || !window.Promise || !window.URL || !window.localStorage) {
  window.location.replace('/lite');
}
</script>
<noscript><meta http-equiv="refresh" content="0;url=/lite"></noscript>
<style>
  :root {
    --bg:#0b0e14; --panel:#141926; --panel2:#1b2233; --edge:#28304226;
    --line:#283042; --ink:#eef1f6; --dim:#8b93a3; --red:#e5484d; --red2:#c93a3f;
    --green:#46a758; --amber:#f5a623; --blue:#4f8ef7; --purple:#9d6bff;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#06080c; color:var(--ink); display:flex; justify-content:center;
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #frame {
    width:100%; max-width:412px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  header {
    display:flex; align-items:center; gap:10px; padding:16px 18px 10px;
  }
  header .logo { font-weight:800; font-size:17px; letter-spacing:.3px; }
  header .logo span { color:var(--red); }
  header .role-tag { color:var(--dim); font-size:12px; }
  header .switch {
    margin-left:auto; color:var(--dim); font-size:12px; background:none; border:1px solid var(--line);
    border-radius:99px; padding:4px 12px; width:auto; cursor:pointer;
  }
  main { flex:1; padding:8px 18px 28px; display:flex; flex-direction:column; }
  h1 { font-size:22px; margin:10px 0 4px; }
  p.lead { color:var(--dim); font-size:13px; }
  button {
    font:inherit; font-weight:600; border:0; border-radius:14px; padding:14px;
    background:var(--panel2); color:var(--ink); width:100%; margin-top:10px; cursor:pointer;
  }
  button:active { transform:scale(.985); }
  button.primary { background:var(--blue); }
  button.danger  { background:var(--red); }
  button.subtle  { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button:disabled { opacity:.4; }
  input, select {
    font:inherit; width:100%; margin-top:8px; padding:13px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  label { display:block; margin-top:14px; font-size:12px; color:var(--dim); letter-spacing:.4px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-top:12px;
  }
  .card.tap { cursor:pointer; }
  .card.tap:hover { background:var(--panel2); }
  .card .k { font-size:11px; color:var(--dim); letter-spacing:1px; font-weight:700; }
  .card.duress { border-color:var(--red); background:#231016; }
  .card.duress .k { color:var(--red); }
  .chip {
    display:inline-block; padding:3px 12px; border-radius:99px; font-size:11px; font-weight:700;
    letter-spacing:.6px; border:1px solid var(--line); color:var(--dim); vertical-align:middle;
  }
  .chip.PENDING{color:var(--amber);border-color:var(--amber)} .chip.ACTIVE{color:var(--red);border-color:var(--red)}
  .chip.DISPATCHED{color:var(--blue);border-color:var(--blue)} .chip.ARRIVED{color:var(--purple);border-color:var(--purple)}
  .chip.RESOLVED,.chip.CLOSED{color:var(--green);border-color:var(--green)} .chip.PURGED{color:var(--dim);text-decoration:line-through}
  /* landing */
  .role-card { display:flex; gap:14px; align-items:center; }
  .role-card .ico { font-size:26px; }
  .role-card .sub { color:var(--dim); font-size:12px; }
  /* SOS */
  .sos-wrap { display:flex; flex-direction:column; align-items:center; margin:26px 0 8px; }
  .sos {
    width:190px; height:190px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff6b70, var(--red) 60%);
    color:#fff; font-size:34px; font-weight:900; letter-spacing:3px; border:10px solid #2a141a;
    box-shadow:0 0 0 1px #3a1c22, 0 0 46px #e5484d33; margin-top:0;
  }
  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .cats button { width:auto; flex:1; padding:9px 4px; font-size:12px; margin:0; background:var(--panel); border:1px solid var(--line); color:var(--dim); }
  .cats button.on { border-color:var(--red); color:var(--ink); }
  /* countdown */
  .count { font:800 76px/1 ui-monospace,Menlo,monospace; text-align:center; color:var(--amber); margin:30px 0 6px; }
  /* timeline */
  .tl { display:flex; margin:16px 0 4px; }
  .tl .step { flex:1; text-align:center; font-size:11px; color:var(--dim); position:relative; }
  .tl .step::before {
    content:''; display:block; width:12px; height:12px; border-radius:50%;
    background:var(--line); margin:0 auto 6px;
  }
  .tl .step.on { color:var(--ink); } .tl .step.on::before { background:var(--green); }
  .code {
    font:800 38px/1 ui-monospace,Menlo,monospace; letter-spacing:8px; text-align:center;
    padding:16px; background:#06080c; border-radius:14px; margin-top:10px; color:var(--ink);
  }
  .map { width:100%; border-radius:14px; margin-top:12px; display:block; background:#0d1320; }
  .foot { color:#525a6a; font-size:11px; margin-top:14px; border-left:2px solid var(--line); padding-left:10px; }
  .center { text-align:center; }
  .big-ico { font-size:52px; text-align:center; margin-top:40px; }
  #toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#2a1419;
    border:1px solid var(--red); color:var(--ink); padding:10px 18px; border-radius:12px;
    font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%;
  }
  .consent { font-size:12px; color:var(--dim); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; max-height:150px; overflow:auto; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  a { color:var(--blue); }
</style>
</head>
<body>
<div id="frame">
  <header>
    <div class="logo">sah<span>ay</span></div>
    <div class="role-tag" id="role-tag"></div>
    <button class="switch" onclick="go('')">switch role</button>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* ----------------------------- utilities ----------------------------- */
const $m = document.getElementById('main');
const store = {
  get: (k, d) => { try { const v = localStorage.getItem('sahay.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => localStorage.setItem('sahay.' + k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem('sahay.' + k),
};
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.opacity = 0), 2600);
}
async function api(path, body, method, headers) {
  const h = { ...(headers || {}) };
  if (body !== undefined) h['content-type'] = 'application/json';
  const r = await fetch(path, {
    method: method || (body !== undefined ? 'POST' : 'GET'),
    headers: h,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ('http ' + r.status));
  return j;
}
const seekerAuth = () => ({ authorization: 'Bearer ' + (store.get('session', {}).token || '') });
const responderAuth = () => ({ 'x-responder-token': store.get('responder.token', '') });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go = (h) => { location.hash = h; };
const CONSENT_V1 = 'By triggering an emergency session you consent to: (1) your precise location being shared with your chosen trusted contacts for the duration of this session only; (2) your approximate (~1 km) area and a session alias being shared with verified responders; (3) your exact location being shared with the one responder you accept; (4) all of this data being destroyed when the session is purged.';
const CATS = { personal_safety: 'Personal safety', medical: 'Medical', accident: 'Accident', other: 'Other' };
const BASE = { lat: 12.9716, lng: 77.5946 }; // demo city: Bengaluru

/* ------------------------------- map --------------------------------- */
function mapSvg(cellId, loc, opts = {}) {
  let R = 1297, C = 7759;
  if (cellId) { const p = cellId.split(':'); R = +p[1]; C = +p[2]; }
  else if (loc) { R = Math.floor(loc.lat * 100); C = Math.floor(loc.lng * 100); }
  const N = 5, S = 64, W = N * S;
  let g = '';
  for (let i = 0; i <= N; i++) {
    g += `<line x1="0" y1="${i*S}" x2="${W}" y2="${i*S}" stroke="#1b2333" stroke-width="1"/>`;
    g += `<line x1="${i*S}" y1="0" x2="${i*S}" y2="${W}" stroke="#1b2333" stroke-width="1"/>`;
  }
  // pseudo city blocks for texture, seeded by cell so the map is stable
  let seed = R * 31 + C;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  let blocks = '';
  for (let i = 0; i < 26; i++) {
    blocks += `<rect x="${rnd()*W}" y="${rnd()*W}" width="${6+rnd()*16}" height="${4+rnd()*10}" fill="#161e2e" rx="1"/>`;
  }
  const cx = 2 * S, cy = 2 * S;
  const cell = opts.hideCell ? '' :
    `<rect x="${cx}" y="${cy}" width="${S}" height="${S}" fill="#e5484d18" stroke="#e5484d" stroke-width="1.5" rx="3"/>
     <text x="${cx + S/2}" y="${cy - 6}" fill="#e5484d" font-size="9" text-anchor="middle" font-family="monospace">cell:${R}:${C} · ~1 km</text>`;
  let dot = '';
  if (loc && opts.dot) {
    const fx = Math.min(.98, Math.max(.02, loc.lng * 100 - C));
    const fy = Math.min(.98, Math.max(.02, 1 - (loc.lat * 100 - R)));
    const dx = cx + fx * S, dy = cy + fy * S;
    dot = `<circle cx="${dx}" cy="${dy}" r="12" fill="#4f8ef733"><animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/></circle>
           <circle cx="${dx}" cy="${dy}" r="5" fill="#4f8ef7" stroke="#fff" stroke-width="1.6"/>`;
  }
  return `<svg class="map" viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${W}" fill="#0d1320"/>${blocks}${g}${cell}${dot}</svg>`;
}

/* ----------------------------- polling -------------------------------- */
let tickBusy = false;
setInterval(async () => {
  if (tickBusy) return; tickBusy = true;
  try { await routeTick(); } catch {} finally { tickBusy = false; }
}, 1500);
// Skip re-render while the user is typing.
const typing = () => ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);

/* ------------------------------ router -------------------------------- */
window.addEventListener('hashchange', render);
let routeTick = async () => {};

function render() {
  const h = location.hash.replace('#', '');
  routeTick = async () => {};
  document.getElementById('role-tag').textContent =
    h.startsWith('seeker') ? '· help seeker' :
    h.startsWith('contact') ? '· trusted contact' :
    h.startsWith('responder') ? '· responder' : '';
  if (h.startsWith('seeker')) return renderSeeker();
  if (h.startsWith('contact/')) return renderContactSession(h.split('/')[1]);
  if (h.startsWith('contact')) return renderContactInbox();
  if (h.startsWith('responder/')) return renderResponderJob(h.split('/')[1]);
  if (h.startsWith('responder')) return renderResponderInbox();
  renderLanding();
}

/* ------------------------------ landing ------------------------------- */
function renderLanding() {
  $m.innerHTML = `
    <h1>Who is holding this phone?</h1>
    <p class="lead">Sahay is session-shaped: every capability below exists only inside a consented,
      time-boxed emergency session.</p>
    <div class="card tap" onclick="go('seeker')"><div class="role-card">
      <div class="ico">🆘</div><div><b>I might need help</b>
      <div class="sub">Trigger sessions, alert your circle, summon a verified responder.</div></div></div></div>
    <div class="card tap" onclick="go('contact')"><div class="role-card">
      <div class="ico">👁️</div><div><b>I watch over someone</b>
      <div class="sub">Receive alerts, see their live session, dispatch responders.</div></div></div></div>
    <div class="card tap" onclick="go('responder')"><div class="role-card">
      <div class="ico">🏃</div><div><b>I'm a verified responder</b>
      <div class="sub">Accept dispatches. You never see who — only a session alias and an area.</div></div></div></div>
    <div class="foot">No smartphone? <a href="/lite">basic web version</a> works on any browser,
      and the whole flow runs over <a href="/phone">SMS</a> for phones with no browser at all.<br>
      Demo wiring: PINs safe 1234 / duress 9999 · ops console at <a href="/console">/console</a></div>`;
}

/* --------------------------- seeker: screens --------------------------- */
let seekerCat = 'personal_safety';
function renderSeeker() {
  const profile = store.get('profile', null);
  if (!profile) return renderOnboarding();
  const sess = store.get('session', null);
  if (!sess) return renderSeekerHome(profile);
  renderSeekerSession();
}

function renderOnboarding() {
  $m.innerHTML = `
    <h1>Set up your circle</h1>
    <p class="lead">Stored on this device only. The server learns it encrypted, per session,
      and forgets it cryptographically when each session is purged.</p>
    <label>YOUR NAME</label><input id="ob-name" value="Meera Krishnan">
    <label>TRUSTED CONTACT — NAME</label><input id="ob-cname" value="Arjun">
    <label>TRUSTED CONTACT — PHONE</label><input id="ob-cphone" value="+91-98765-43210">
    <div class="row">
      <div><label>SAFE PIN (cancels)</label><input id="ob-pin-safe" value="1234" inputmode="numeric" maxlength="6"></div>
      <div><label>DURESS PIN (fakes it)</label><input id="ob-pin-duress" value="9999" inputmode="numeric" maxlength="6"></div>
    </div>
    <label>CONSENT (v1)</label><div class="consent">${esc(CONSENT_V1)}</div>
    <button class="primary" onclick="saveProfile()">I consent — create my circle</button>`;
}
function saveProfile() {
  const name = document.getElementById('ob-name').value.trim();
  const cname = document.getElementById('ob-cname').value.trim();
  const cphone = document.getElementById('ob-cphone').value.trim();
  const pinSafe = document.getElementById('ob-pin-safe').value.trim();
  const pinDuress = document.getElementById('ob-pin-duress').value.trim();
  if (!name || !cname || !cphone) return toast('All fields are needed');
  if (!/^\d{4,6}$/.test(pinSafe) || !/^\d{4,6}$/.test(pinDuress)) return toast('PINs must be 4-6 digits');
  if (pinSafe === pinDuress) return toast('Safe and duress PINs must differ');
  store.set('profile', {
    name,
    contacts: [{ id: 'c-' + cname.toLowerCase(), name: cname, address: cphone }],
    pins: { safe: pinSafe, duress: pinDuress },
  });
  store.set('consent', 'v1');
  render();
}

function renderSeekerHome(profile) {
  $m.innerHTML = `
    <h1>Hi ${esc(profile.name.split(' ')[0])}.</h1>
    <p class="lead">Hold steady — help is one tap away. Demo location: Bengaluru.</p>
    <div class="cats">${Object.entries(CATS).map(([k, v]) =>
      `<button class="${k === seekerCat ? 'on' : ''}" onclick="seekerCat='${k}';render()">${v}</button>`).join('')}</div>
    <div class="sos-wrap"><button class="sos" onclick="trigger()">SOS</button></div>
    <p class="lead center">Starts a session with a 30-second cancel window.</p>
    <div class="card"><div class="k">YOUR CIRCLE</div>
      ${profile.contacts.map((c) => `<div>${esc(c.name)} · ${esc(c.address)}</div>`).join('')}
    </div>
    <button class="subtle" onclick="store.del('profile');render()">edit circle</button>`;
}

async function trigger() {
  const profile = store.get('profile');
  const loc = { lat: BASE.lat + (Math.random() - .5) * .004, lng: BASE.lng + (Math.random() - .5) * .004 };
  try {
    const r = await api('/sessions', {
      userId: 'user-' + profile.name.toLowerCase().replace(/\s+/g, '-'),
      displayName: profile.name,
      contacts: profile.contacts.map((c) => ({ id: c.id, address: c.address })),
      location: loc, category: seekerCat,
      pins: profile.pins,
    });
    store.set('session', { id: r.sessionId, token: r.seekerToken, t0: Date.now(), countdownMs: r.activationCountdownMs, loc, dispatched: false });
    render();
  } catch (e) { toast(e.message); }
}

function renderSeekerSession() {
  const sess = store.get('session');
  $m.innerHTML = '<div id="dyn"></div>';
  let last = '';
  routeTick = async () => {
    let st = null;
    try {
      st = await api('/sessions/' + sess.id, undefined, 'GET', seekerAuth());
    } catch (e) {
      // Stale or foreign session (e.g. server reset, missing token): let go.
      if (/authentication|not found/.test(e.message)) { clearSession(); }
      return;
    }
    let code = null;
    if (st.state === 'DISPATCHED') code = (await api(`/sessions/${sess.id}/arrival-code`, undefined, 'GET', seekerAuth()).catch(() => ({}))).code;
    sendPing(st.state);
    const html = seekerScreen(st.state, sess, code);
    if (html !== last && !typing()) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}

function seekerScreen(state, sess, code) {
  if (state === 'PENDING') {
    const left = Math.max(0, Math.ceil((sess.countdownMs - (Date.now() - sess.t0)) / 1000));
    return `
      <h1 class="center" style="margin-top:26px">Activating…</h1>
      <div class="count">${left}</div>
      <p class="lead center">Your circle is alerted when this reaches zero.</p>
      <button class="danger" onclick="confirmNow()">I need help NOW</button>
      <label>ENTER PIN TO CANCEL</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••">
      <button class="subtle" onclick="cancelSession()">Cancel session</button>`;
  }
  if (['ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(state)) {
    const steps = ['Circle alerted', 'Responder coming', 'Responder here'];
    const on = state === 'ACTIVE' ? 1 : state === 'DISPATCHED' ? 2 : 3;
    return `
      <h1>Help is in motion <span class="chip ${state}">${state}</span></h1>
      <div class="tl">${steps.map((s, i) => `<div class="step ${i < on ? 'on' : ''}">${s}</div>`).join('')}</div>
      ${mapSvg(null, sess.loc, { dot: true, hideCell: true })}
      ${state === 'ACTIVE' && !sess.dispatched ? `<button class="primary" onclick="requestResponder()">Request a verified responder</button>` : ''}
      ${state === 'ACTIVE' && sess.dispatched ? `<p class="lead center" style="margin-top:10px">Responders notified — waiting for one to accept…</p>` : ''}
      ${state === 'DISPATCHED' && code ? `<p class="lead center" style="margin-top:12px">Show this code to your responder — it proves they really reached you:</p><div class="code">${code}</div>` : ''}
      ${state === 'ARRIVED' ? `<p class="lead center" style="margin-top:12px">Your responder is with you.</p>` : ''}
      <button onclick="resolveSession()">I am safe — end session</button>
      <div class="foot">Your location is being recorded encrypted, inside this session only.
        No cancel exists once a session is live — that is deliberate.</div>`;
  }
  if (state === 'RESOLVED') {
    return `<div class="big-ico">✅</div><h1 class="center">You're safe.</h1>
      <p class="lead center">This session will close automatically in 24&nbsp;h and its data will be
      cryptographically destroyed 7&nbsp;days later.</p>
      <button onclick="clearSession()">Done</button>`;
  }
  return `<div class="big-ico">🌙</div><h1 class="center">Session cancelled</h1>
    <p class="lead center">Nobody was notified.</p>
    <button onclick="clearSession()">Back to home</button>`;
}
async function confirmNow() { try { await api(`/sessions/${store.get('session').id}/confirm`, {}, 'POST', seekerAuth()); } catch (e) { toast(e.message); } routeTick(); }
async function cancelSession() {
  const pin = document.getElementById('pin').value;
  try { await api(`/sessions/${store.get('session').id}/cancel`, { pin }, 'POST', seekerAuth()); routeTick(); }
  catch (e) { toast(e.message); }
}
async function requestResponder() {
  const sess = store.get('session');
  try { await api(`/sessions/${sess.id}/dispatch`, {}, 'POST', seekerAuth()); sess.dispatched = true; store.set('session', sess); routeTick(); }
  catch (e) { toast(e.message); }
}
async function resolveSession() { try { await api(`/sessions/${store.get('session').id}/resolve`, {}, 'POST', seekerAuth()); routeTick(); } catch (e) { toast(e.message); } }
function clearSession() { store.del('session'); render(); }

let lastPing = 0;
async function sendPing(state) {
  const sess = store.get('session');
  if (!sess || Date.now() - lastPing < 8000) return;
  if (!['PENDING', 'ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(state)) return;
  lastPing = Date.now();
  sess.loc = { lat: sess.loc.lat + (Math.random() - .5) * .0006, lng: sess.loc.lng + (Math.random() - .5) * .0006 };
  store.set('session', sess);
  api(`/sessions/${sess.id}/location`, sess.loc, 'POST', seekerAuth()).catch(() => {});
}

/* ------------------------------ contact ------------------------------- */
function renderContactInbox() {
  const addr = store.get('contact.addr', null);
  if (!addr) {
    $m.innerHTML = `
      <h1>Your alert number</h1>
      <p class="lead">Alerts addressed to this number appear here. Use the number the help seeker
        saved in their circle.</p>
      <input id="ct-addr" value="+91-98765-43210">
      <button class="primary" onclick="store.set('contact.addr',document.getElementById('ct-addr').value.trim());render()">Start watching</button>`;
    return;
  }
  $m.innerHTML = `<h1>Alerts</h1>
    <p class="lead">for ${esc(addr)} · <a href="#" onclick="store.del('contact.addr');render();return false">change</a></p>
    <div id="dyn"><p class="lead" style="margin-top:30px">No alerts. You will hear nothing unless
      someone in your circle activates a session.</p></div>`;
  let last = '';
  routeTick = async () => {
    const ob = await api('/dev/outbox', undefined, 'GET');
    const mine = ob.contactAlerts.filter((a) => a.to === addr).reverse();
    // Remember each session's contact capability token from its link.
    const tokens = store.get('contact.tokens', {});
    for (const a of mine) {
      const t = new URL(a.liveSessionLink).searchParams.get('t');
      if (t) tokens[a.sessionId] = t;
    }
    store.set('contact.tokens', tokens);
    const seen = new Set();
    const cards = mine.filter((a) => !seen.has(a.sessionId) && seen.add(a.sessionId)).map((a) => `
      <div class="card tap ${a.duress ? 'duress' : ''}" onclick="go('contact/${a.sessionId}')">
        <div class="k">${a.duress ? '⚠ DURESS — THE CANCEL WAS COERCED'
          : a.escalation ? '⏳ ESCALATION — STILL NO RESPONDER' : 'EMERGENCY ALERT'}</div>
        <b>${esc(a.helpseekerDisplayName)}</b> needs help · ${CATS[a.category] || a.category}<br>
        <span style="color:var(--dim);font-size:12px">${new Date(a.sentAt).toLocaleTimeString()}</span></div>`).join('');
    if (cards && cards !== last) { document.getElementById('dyn').innerHTML = cards; last = cards; }
  };
  routeTick();
}
const contactToken = (sid) => store.get('contact.tokens', {})[sid] || '';

function renderContactSession(sid) {
  $m.innerHTML = `<div id="dyn"><p class="lead">loading…</p></div>`;
  let last = '';
  routeTick = async () => {
    const v = await api(`/sessions/${sid}/contact-view?t=${contactToken(sid)}`, undefined, 'GET').catch(() => null);
    if (!v) return;
    const live = ['PENDING', 'ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(v.state);
    const html = `
      ${v.duress ? `<div class="card duress"><div class="k">⚠ DURESS</div>Their phone shows
        “cancelled”. Do <b>not</b> call them — the attacker may be present. Coordinate from here.</div>` : ''}
      <h1>${esc(v.helpseekerDisplayName || 'Session')} <span class="chip ${v.state}">${v.state}</span></h1>
      <p class="lead">${CATS[v.category] || v.category}</p>
      ${v.location ? mapSvg(null, v.location, { dot: true, hideCell: true }) +
        `<p class="lead center">live · ${v.location.lat.toFixed(5)}, ${v.location.lng.toFixed(5)}</p>` :
        `<p class="lead" style="margin-top:20px">${live ? 'Waiting for a location…' : 'This session has ended; its location data is gone.'}</p>`}
      ${v.state === 'ACTIVE' ? `<button class="primary" onclick="contactDispatch('${sid}')">Dispatch verified responders</button>` : ''}
      ${v.state === 'DISPATCHED' ? `<p class="lead center" style="margin-top:8px">A responder is on the way.</p>` : ''}
      <button class="subtle" onclick="go('contact')">← all alerts</button>`;
    if (html !== last) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}
async function contactDispatch(sid) { try { await api(`/sessions/${sid}/dispatch?t=${contactToken(sid)}`, {}); routeTick(); } catch (e) { toast(e.message); } }

/* ----------------------------- responder ------------------------------ */
function renderResponderInbox() {
  const rid = store.get('responder.id', null);
  if (!rid) {
    $m.innerHTML = `<h1>Who are you?</h1>
      <p class="lead">Verified responders only. Pick your enrolled identity.</p><div id="dyn"></div>`;
    api('/dev/roster', undefined, 'GET').then((roster) => {
      document.getElementById('dyn').innerHTML = roster.map((r) => `
        <div class="card tap" onclick="store.set('responder.id','${r.id}');store.set('responder.token','${r.devToken}');render()">
          <b>${esc(r.id.replace('responder-', ''))}</b>
          <div style="color:var(--dim);font-size:12px">zone ${esc(r.availabilityCell)} · ${r.verified ? '✓ verified' : 'unverified'}</div></div>`).join('');
    });
    return;
  }
  $m.innerHTML = `<h1>Dispatch offers</h1>
    <p class="lead">for ${esc(rid)} · <a href="#" onclick="store.del('responder.id');render();return false">change</a></p>
    <div id="dyn"><p class="lead" style="margin-top:30px">No offers right now.</p></div>`;
  let last = '';
  routeTick = async () => {
    const ob = await api('/dev/outbox', undefined, 'GET');
    const mine = ob.responderOffers.filter((o) => o.to === rid).reverse();
    const seen = new Set();
    const cards = mine.filter((o) => !seen.has(o.sessionId) && seen.add(o.sessionId)).map((o) => `
      <div class="card tap" onclick="go('responder/${o.sessionId}')">
        <div class="k">DISPATCH OFFER</div>
        <b>${esc(o.alias)}</b> · ${CATS[o.category] || o.category}<br>
        <span style="color:var(--dim);font-size:12px">area ${esc(o.coarseCell)} (~1 km) ·
        ${new Date(o.sentAt).toLocaleTimeString()}</span></div>`).join('');
    if (cards && cards !== last) { document.getElementById('dyn').innerHTML = cards; last = cards; }
  };
  routeTick();
}

function renderResponderJob(sid) {
  const rid = store.get('responder.id');
  $m.innerHTML = `<div id="dyn"><p class="lead">loading…</p></div>`;
  let last = '';
  routeTick = async () => {
    const v = await api(`/sessions/${sid}/responder-view/${rid}`, undefined, 'GET', responderAuth()).catch(() => null);
    if (!v) return;
    const accepted = (store.get('responder.accepted', [])).includes(sid);
    let html = `<h1>${esc(v.alias)} <span class="chip ${v.state}">${v.state}</span></h1>
      <p class="lead">${CATS[v.category] || v.category}</p>`;
    if (v.state === 'ACTIVE') {
      html += mapSvg(v.coarseCell, null, {}) + `
        <p class="lead center">You see an area, not an address — identity and exact position are
          released only to the responder who accepts.</p>
        <button class="primary" onclick="acceptJob('${sid}')">Accept this dispatch</button>`;
    } else if (v.state === 'DISPATCHED' && accepted && v.location) {
      html += mapSvg(v.coarseCell, v.location, { dot: true }) + `
        <p class="lead center">${v.location.lat.toFixed(5)}, ${v.location.lng.toFixed(5)} ·
          <a href="https://maps.google.com/?q=${v.location.lat},${v.location.lng}" target="_blank">navigate ↗</a></p>
        <label>CODE FROM THE HELP SEEKER'S SCREEN</label>
        <input id="arr-code" inputmode="numeric" maxlength="6" placeholder="······">
        <button class="primary" onclick="verifyArrival('${sid}')">Verify arrival</button>
        <button class="subtle" onclick="withdrawJob('${sid}')">I can't make it — withdraw</button>`;
    } else if (v.state === 'DISPATCHED') {
      html += `<p class="lead" style="margin-top:24px">Another responder took this one. Stand down.</p>`;
    } else if (v.state === 'ARRIVED') {
      html += `<div class="big-ico">🤝</div><p class="lead center">You're on scene. Stay until the
        help seeker resolves the session.</p>`;
    } else if (v.state === 'RESOLVED' || v.state === 'CLOSED' || v.state === 'PURGED') {
      html += `<div class="big-ico">✅</div><p class="lead center">Session resolved. Thank you.
        You never learned who they were — that is the point.</p>`;
    } else {
      html += `<p class="lead" style="margin-top:24px">This session is no longer dispatchable.</p>`;
    }
    html += `<button class="subtle" onclick="go('responder')">← offers</button>`;
    if (html !== last && !typing()) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}
async function acceptJob(sid) {
  try {
    await api(`/sessions/${sid}/accept`, { responderId: store.get('responder.id') }, 'POST', responderAuth());
    const a = store.get('responder.accepted', []); a.push(sid); store.set('responder.accepted', a);
    routeTick();
  } catch (e) { toast(e.message); }
}
async function verifyArrival(sid) {
  try {
    await api(`/sessions/${sid}/arrival`, { responderId: store.get('responder.id'), code: document.getElementById('arr-code').value }, 'POST', responderAuth());
    routeTick();
  } catch (e) { toast(e.message); }
}
async function withdrawJob(sid) {
  try {
    await api(`/sessions/${sid}/withdraw`, { responderId: store.get('responder.id') }, 'POST', responderAuth());
    store.set('responder.accepted', store.get('responder.accepted', []).filter((x) => x !== sid));
    go('responder');
  } catch (e) { toast(e.message); }
}

render();
</script>
</body>
</html>
