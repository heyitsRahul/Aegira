<style>
  :root {

  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#06080c; color:var(--ink); display:flex; justify-content:center;

  #frame {
    width:100%; max-width:412px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);

  button, a, input, select { touch-action:manipulation; }
  header {
    display:flex; align-items:center; gap:10px; padding:16px 18px 10px;
  }
  header .logo { font-weight:800; font-size:17px; letter-spacing:.3px; }
  header .logo span { color:var(--red); }
  header .role-tag { color:var(--dim); font-size:12px; }
  header .switch {
    margin-left:auto; color:var(--dim); font-size:12px; background:none; border:1px solid var(--line);
    border-radius:99px; padding:4px 12px; width:auto; cursor:pointer;
  }
  main { flex:1; padding:8px 18px 28px; display:flex; flex-direction:column; }
  h1 { font-size:22px; margin:10px 0 4px; }
  p.lead { color:var(--dim); font-size:13px; }
  button {
    font:inherit; font-weight:600; border:0; border-radius:14px; padding:14px;
    background:var(--panel2); color:var(--ink); width:100%; margin-top:10px; cursor:pointer;
  }
  button:active { transform:scale(.985); }
  button.primary { background:var(--blue); }
  button.danger  { background:var(--red); }
  button.subtle  { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button:disabled { opacity:.4; }
  input, select {
    font:inherit; width:100%; margin-top:8px; padding:13px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  label { display:block; margin-top:14px; font-size:12px; color:var(--dim); letter-spacing:.4px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-top:12px;
  }
  .card.tap { cursor:pointer; }
  .card.tap:hover { background:var(--panel2); }
  .card .k { font-size:11px; color:var(--dim); letter-spacing:1px; font-weight:700; }
  .card.duress { border-color:var(--red); background:#231016; }
  .card.duress .k { color:var(--red); }
  .chip {
    display:inline-block; padding:3px 12px; border-radius:99px; font-size:11px; font-weight:700;
    letter-spacing:.6px; border:1px solid var(--line); color:var(--dim); vertical-align:middle;
  }
  .chip.PENDING{color:var(--amber);border-color:var(--amber)} .chip.ACTIVE{color:var(--red);border-color:var(--red)}
  .chip.DISPATCHED{color:var(--blue);border-color:var(--blue)} .chip.ARRIVED{color:var(--purple);border-color:var(--purple)}
  .chip.RESOLVED,.chip.CLOSED{color:var(--green);border-color:var(--green)} .chip.PURGED{color:var(--dim);text-decoration:line-through}
  /* landing */
  .role-card { display:flex; gap:14px; align-items:center; }
  .role-card .ico { font-size:26px; }
  .role-card .sub { color:var(--dim); font-size:12px; }
  /* SOS */
  .sos-wrap { display:flex; flex-direction:column; align-items:center; margin:26px 0 8px; }
  .sos {
    width:190px; height:190px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff6b70, var(--red) 60%);
    color:#fff; font-size:34px; font-weight:900; letter-spacing:3px; border:10px solid #2a141a;
    box-shadow:0 0 0 1px #3a1c22, 0 0 46px #e5484d33; margin-top:0;
  }
  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

  .cats button.on { border-color:var(--red); color:var(--ink); }

  .count { font:800 76px/1 ui-monospace,Menlo,monospace; text-align:center; color:var(--amber); margin:30px 0 6px; }
  /* timeline */
  .tl { display:flex; margin:16px 0 4px; }
  .tl .step { flex:1; text-align:center; font-size:11px; color:var(--dim); position:relative; }
  .tl .step::before {
    content:''; display:block; width:12px; height:12px; border-radius:50%;
    background:var(--line); margin:0 auto 6px;
  }
  .tl .step.on { color:var(--ink); } .tl .step.on::before { background:var(--green); }
  .code {
    font:800 38px/1 ui-monospace,Menlo,monospace; letter-spacing:8px; text-align:center;
    padding:16px; background:#06080c; border-radius:14px; margin-top:10px; color:var(--ink);

  .center { text-align:center; }
  .big-ico { font-size:52px; text-align:center; margin-top:40px; }
  #toast {

  .help a b { font-size:17px; color:#ff8a8e; }
  .help a span { font-size:10px; color:var(--dim); }
  .cat-ico { font-size:15px; margin-right:2px; }
  .country-row { display:flex; gap:8px; } .country-row select { flex:0 0 42%; } .country-row input { flex:1; }

  .lang-pick{display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .lang-pick button{font-size:26px;font-weight:700;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
  .topctl{display:flex;gap:8px;margin-left:auto}
  .topctl button{width:auto;margin:0;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 12px;font-size:12px;min-height:36px}
  .bigbtn{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:12px}

  .bigbtn b{font-size:19px;display:block}
  .bigbtn .s{color:var(--dim);font-size:13px}
  .modebar{display:flex;gap:10px;margin-top:6px}

  .modebar button.on{border-color:var(--red);color:var(--ink)}
  .modebar button .mi{font-size:22px;display:block;margin-bottom:4px}
  .steps{margin:8px 0 4px 20px;padding:0}.steps li{margin:6px 0;font-size:14px}
  .card.how{border-color:var(--blue)}.card.how .row{align-items:center;margin-top:6px}
  .loc{font-size:13px;color:var(--dim);margin-top:14px}
  .soon .soon-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .soon .soon-list button{width:auto;margin:0;padding:8px 12px;font-size:15px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;min-height:40px}

    :root { --bg:#f6f7f9; --panel:#fff; --panel2:#eef1f5; --line:#d4dae3; --ink:#11151c; --dim:#5b6472; }
    body { background:#e9ecf1; }

.demo-banner{display:block;width:100%;flex:none;background:#f5a623;color:#111;text-align:center;font:600 13px/1.4 -apple-system,"Segoe UI",sans-serif;padding:8px 12px;text-decoration:none}

const store = {
  get: (k, d) => { try { const v = localStorage.getItem('aegira.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => localStorage.setItem('aegira.' + k, JSON.stringify(v)),
  del: (k) => localStorage.removeItem('aegira.' + k),

// Server and network errors in plain words, in the chosen language.
function friendlyError(e) {
  const m = String((e && e.message) || '');
  if (/location unknown/i.test(m)) return t('err_location');
  if (/invalid pin|wrong pin/i.test(m)) return t('err_pin');
  if (/already live/i.test(m)) return t('err_live');
  if (/failed to fetch|networkerror|load failed/i.test(m)) return t('err_network');
  if (/too many requests/i.test(m)) return t('err_busy');
  if (/^invalid input: /i.test(m)) return m.replace(/^invalid input: /i, '');
  return t('err_generic');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.opacity = 0), 2600);
}
async function api(path, body, method, headers) {
  const h = { ...(headers || {}) };
  if (body !== undefined) h['content-type'] = 'application/json';
  const r = await fetch(path, {
    method: method || (body !== undefined ? 'POST' : 'GET'),
    headers: h,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ('http ' + r.status));
  return j;
}
const seekerAuth = () => ({ authorization: 'Bearer ' + (store.get('session', {}).token || '') });
const responderAuth = () => ({ 'x-responder-token': store.get('responder.token', '') });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CONSENT_V1 = 'By triggering an emergency session you consent to: (1) your precise location being shared with your chosen trusted contacts for the duration of this session only; (2) your approximate (~1 km) area and a session alias being shared with verified responders; (3) your exact location being shared with the one responder you accept; (4) all of this data being destroyed when the session is purged.';

  personal_safety: { label: 'Personal safety', ico: '🛡️' },

  return (REF.helplines && REF.helplines[country]) || [{ label: 'Emergency', number: '112' }];

  return `<div class="help"><div class="k">${esc(t('helplines_title'))}</div><div class="nums">${nums}</div></div>`;

const langCode = () => store.get('lang', null);
function t(key, vars) {
  const l = langCode() || 'en';
  let s = (STR[l] && STR[l][key]) || STR.en[key] || key;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}
function setLang(code) { store.set('lang', code); document.documentElement.lang = code; render(); }
const soundOn = () => store.get('sound', true);
function toggleSound() { store.set('sound', !soundOn()); if (soundOn()) speakKey('v_safe'); render(); }
// Voice prompts: built-in speech, no dependency. Speaks the chosen language.
function speakKey(key) {
  if (!soundOn() || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(t(key));
    const l = langCode() || 'en';
    u.lang = (LANGS.find((x) => x.code === l) || LANGS[0]).voice;
    u.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch {}
}

function mapSvg(cellId, loc, opts = {}) {
  let R = 1297, C = 7759;
  if (cellId) { const p = cellId.split(':'); R = +p[1]; C = +p[2]; }
  else if (loc) { R = Math.floor(loc.lat * 100); C = Math.floor(loc.lng * 100); }
  const N = 5, S = 64, W = N * S;
  let g = '';
  for (let i = 0; i <= N; i++) {
    g += `<line x1="0" y1="${i*S}" x2="${W}" y2="${i*S}" stroke="#1b2333" stroke-width="1"/>`;
    g += `<line x1="${i*S}" y1="0" x2="${i*S}" y2="${W}" stroke="#1b2333" stroke-width="1"/>`;
  }
  // pseudo city blocks for texture, seeded by cell so the map is stable
  let seed = R * 31 + C;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  let blocks = '';
  for (let i = 0; i < 26; i++) {
    blocks += `<rect x="${rnd()*W}" y="${rnd()*W}" width="${6+rnd()*16}" height="${4+rnd()*10}" fill="#161e2e" rx="1"/>`;
  }
  const cx = 2 * S, cy = 2 * S;
  const cell = opts.hideCell ? '' :
    `<rect x="${cx}" y="${cy}" width="${S}" height="${S}" fill="#e5484d18" stroke="#e5484d" stroke-width="1.5" rx="3"/>
     <text x="${cx + S/2}" y="${cy - 6}" fill="#e5484d" font-size="9" text-anchor="middle" font-family="sans-serif">≈ 1 km</text>`;
  let dot = '';
  if (loc && opts.dot) {
    const fx = Math.min(.98, Math.max(.02, loc.lng * 100 - C));
    const fy = Math.min(.98, Math.max(.02, 1 - (loc.lat * 100 - R)));
    const dx = cx + fx * S, dy = cy + fy * S;
    dot = `<circle cx="${dx}" cy="${dy}" r="12" fill="#4f8ef733"><animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/></circle>
           <circle cx="${dx}" cy="${dy}" r="5" fill="#4f8ef7" stroke="#fff" stroke-width="1.6"/>`;
  }
  return `<svg class="map" viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${W}" fill="#0d1320"/>${blocks}${g}${cell}${dot}</svg>`;
}

/* ---------------------------- real location ---------------------------- */
// The phone's GPS is read only when you press SOS or start a watch, and
// followed only while a session is live — never in the background
// (invariant 1). If location is off, you choose your area instead.
let gpsPerm = navigator.geolocation ? 'prompt' : 'denied'; // 'granted' | 'prompt' | 'denied'
if (navigator.permissions && navigator.geolocation) {
  navigator.permissions.query({ name: 'geolocation' }).then((p) => {
    gpsPerm = p.state; p.onchange = () => { gpsPerm = p.state; if (!typing()) render(); };
    if (!typing()) render();
  }).catch(() => {});
}
function readGps(timeoutMs) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => { gpsPerm = 'granted'; resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
      (err) => { if (err.code === 1) gpsPerm = 'denied'; resolve(null); },
      { enableHighAccuracy: true, timeout: timeoutMs || 8000, maximumAge: 30000 });
  });
}
// Asks for permission ahead of an emergency; the reading itself is discarded.
async function askGps() { await readGps(10000); render(); }
// A chosen area, or null when it isn't listed: better no location than a
// wrong one. Contacts are then told the location is unknown.
function pickedArea() {
  const c = DEMO_CITIES.find((x) => x.id === seekerCity);
  return c ? { lat: c.lat, lng: c.lng } : null;
}
async function sessionStartLocation() {
  const gps = gpsPerm === 'denied' ? null : await readGps(8000);
  return gps ? { loc: gps, realLoc: true } : { loc: pickedArea(), realLoc: false };
}
let gpsWatch = null;
let latestFix = null;
function followGps() {
  if (gpsWatch !== null || !navigator.geolocation) return;
  gpsWatch = navigator.geolocation.watchPosition(
    (p) => { latestFix = { lat: p.coords.latitude, lng: p.coords.longitude }; },
    () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
function stopGps() {
  if (gpsWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = null; latestFix = null;
}

// One identity per device (random, never derived from name or number), so
// two people who type the same name never collide on "one live session".
function deviceUserId() {
  let id = store.get('device', null);
  if (!id) {
    const b = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(b);
    id = 'user-' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
    store.set('device', id);
  }
  return id;
}

function renderSeekerSession() {
  $m.innerHTML = '<div id="dyn"></div>';
  let last = '';
  let spokenState = null;
  routeTick = async () => {
    // Read the session fresh each time: actions (asking for a helper, new
    // GPS fixes) update it after this screen was first drawn.
    const sess = store.get('session');
    if (!sess) return;
    let st = null;
    try {
      st = await api('/sessions/' + sess.id, undefined, 'GET', seekerAuth());
    } catch (e) {
      // Stale or foreign session (e.g. server reset, missing token): let go.
      if (/authentication|not found/.test(e.message)) { clearSession(); }
      return;
    }
    let code = null;
    if (st.state === 'DISPATCHED') code = (await api(`/sessions/${sess.id}/arrival-code`, undefined, 'GET', seekerAuth()).catch(() => ({}))).code;
    if (st.watchDeadline) { sess.deadline = st.watchDeadline; store.set('session', sess); }
    // Speak the big moments aloud, once per change (respects the duress mask,
    // since it reads the same masked client state the screen shows).
    if (st.state !== spokenState) {
      const live = (s) => ['ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(s);
      if (live(st.state) && !live(spokenState || '')) speakKey('v_active');
      else if (st.state === 'RESOLVED') speakKey('v_safe');
      else if (['CANCELLED', 'CLOSED', 'PURGED'].includes(st.state)) speakKey('v_cancelled');
      spokenState = st.state;
    }
    sendPing(st.state);
    const html = seekerScreen(st.state, sess, code);
    if (html !== last && !typing()) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}

function seekerScreen(state, sess, code) {
  const help = helplineCard(store.get('profile', {}).country);
  if (state === 'WATCHING') {
    const leftMs = sess.deadline ? Date.parse(sess.deadline) - Date.now() : 0;
    const mins = Math.max(0, Math.floor(leftMs / 60000));
    const secs = Math.max(0, Math.floor((leftMs % 60000) / 1000));
    return `
      <h1>🛡️ ${esc(t('watch_title'))}</h1>
      <div class="count" style="color:var(--green)">${mins}:${String(secs).padStart(2, '0')}</div>
      <p class="lead center">${esc(t('until_alerted'))}</p>
      <button class="primary" onclick="checkInSafe()">✅ ${esc(t('check_in_safe'))}</button>
      <input id="pin" inputmode="numeric" maxlength="6" placeholder="${esc(t('your_pin'))}" aria-label="${esc(t('your_pin'))}">
      <button class="subtle" onclick="extendWatch()">＋ ${esc(t('more_time'))}</button>
      ${help}`;
  }
  if (state === 'PENDING') {
    const left = Math.max(0, Math.ceil((sess.countdownMs - (Date.now() - sess.t0)) / 1000));
    return `
      <h1 class="center" style="margin-top:20px">${esc(t('activating'))}</h1>
      <div class="count">${left}</div>
      <p class="lead center">${esc(t('countdown_sub'))}</p>
      <button class="danger" onclick="confirmNow()">${esc(t('need_help_now'))}</button>
      <label>${esc(t('enter_pin_cancel'))}</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="••••" aria-label="${esc(t('enter_pin_cancel'))}">
      <button class="subtle" onclick="cancelSession()">${esc(t('cancel'))}</button>`;
  }
  if (['ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(state)) {
    const steps = [t('step1'), t('step2'), t('step3')];
    const on = state === 'ACTIVE' ? 1 : state === 'DISPATCHED' ? 2 : 3;
    return `
      <h1>${esc(t('help_in_motion'))} <span class="chip ${state}">${esc(t('state_' + state))}</span></h1>
      <div class="tl">${steps.map((s, i) => `<div class="step ${i < on ? 'on' : ''}">${esc(s)}</div>`).join('')}</div>
      ${sess.loc ? mapSvg(null, sess.loc, { dot: true, hideCell: true }) : ''}
      ${state === 'ACTIVE' && !sess.dispatched && sess.loc ? `<button class="primary" onclick="requestResponder()">${esc(t('request_responder'))}</button>` : ''}
      ${state === 'ACTIVE' && !sess.loc ? `<p class="lead center" style="margin-top:10px">${esc(t('no_loc_helper'))}</p>` : ''}
      ${state === 'ACTIVE' && sess.dispatched ? `<p class="lead center" style="margin-top:10px">${esc(t(sess.noHelpers ? 'no_helpers' : 'waiting_accept'))}</p>` : ''}
      ${state === 'DISPATCHED' && code ? `<p class="lead center" style="margin-top:12px">${esc(t('show_code'))}</p><div class="code">${code}</div>` : ''}
      ${state === 'ARRIVED' ? `<p class="lead center" style="margin-top:12px">🤝 ${esc(t('responder_here'))}</p>` : ''}
      <button onclick="resolveSession()">✅ ${esc(t('i_am_safe'))}</button>
      ${help}`;
  }
  if (state === 'RESOLVED') {
    return `<div class="big-ico">✅</div><h1 class="center">${esc(t('youre_safe'))}</h1>
      <p class="lead center">${esc(t('youre_safe_sub'))}</p>
      <button onclick="clearSession()">${esc(t('done'))}</button>`;
  }
  return `<div class="big-ico">🌙</div><h1 class="center">${esc(t('cancelled'))}</h1>
    <p class="lead center">${esc(t('nobody_notified'))}</p>
    <button onclick="clearSession()">${esc(t('back'))}</button>`;
}
async function confirmNow() { try { await api(`/sessions/${store.get('session').id}/confirm`, {}, 'POST', seekerAuth()); } catch (e) { toast(friendlyError(e)); } routeTick(); }
async function cancelSession() {
  const pin = document.getElementById('pin').value;
  try { await api(`/sessions/${store.get('session').id}/cancel`, { pin }, 'POST', seekerAuth()); routeTick(); }
  catch (e) { toast(friendlyError(e)); }
}
async function requestResponder() {
  const sess = store.get('session');
  try {
    // An empty list means no trained helper is near: say so, never "please wait" forever.
    const asked = await api(`/sessions/${sess.id}/dispatch`, {}, 'POST', seekerAuth());
    sess.dispatched = true; sess.noHelpers = Array.isArray(asked) && asked.length === 0;
    store.set('session', sess); routeTick();
  }
  catch (e) { toast(friendlyError(e)); }
}
async function resolveSession() { try { await api(`/sessions/${store.get('session').id}/resolve`, {}, 'POST', seekerAuth()); routeTick(); } catch (e) { toast(friendlyError(e)); } }
function clearSession() { stopGps(); store.del('session'); render(); }

// Live location updates: real GPS fixes only, and only while the session
// is live. A hand-picked area is sent once at the start and never "moves".
let lastPing = 0;
async function sendPing(state) {
  const sess = store.get('session');
  if (!sess || !['WATCHING', 'PENDING', 'ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(state)) { stopGps(); return; }
  if (!sess.realLoc) return;
  followGps();
  if (!latestFix || Date.now() - lastPing < 8000) return;
  lastPing = Date.now();
  sess.loc = latestFix;
  store.set('session', sess);
  api(`/sessions/${sess.id}/location`, sess.loc, 'POST', seekerAuth()).catch(() => {});
}

/* ------------------------------ contact ------------------------------- */
function renderContactInbox() {
  const addr = store.get('contact.addr', null);
  if (!addr) {
    $m.innerHTML = `
      <h1>${esc(t('ct_setup_title'))}</h1>
      <p class="lead">${esc(t('ct_setup_sub'))}</p>
      <input id="ct-addr" placeholder="98765 43210" inputmode="tel" aria-label="${esc(t('ct_setup_title'))}">
      <button class="primary" onclick="const v=document.getElementById('ct-addr').value.trim(); if(v){store.set('contact.addr',v);render()}">${esc(t('ct_start'))}</button>`;
    return;
  }
  $m.innerHTML = `<h1>${esc(t('ct_alerts'))}</h1>
    <p class="lead">${esc(t('ct_for', { number: addr }))} · <a href="#" onclick="store.del('contact.addr');render();return false">${esc(t('ct_change'))}</a></p>
    <div id="dyn"><p class="lead" style="margin-top:30px">${esc(t('ct_none'))}</p></div>`;
  let last = '';
  routeTick = async () => {
    const ob = await api('/dev/outbox', undefined, 'GET');
    // Tolerant match: compare by trailing digits so format differences
    // (+91, spaces, dashes) between seeker and contact don't hide alerts.
    const mineTail = phoneTail(addr);
    const mine = ob.contactAlerts.filter((a) => phoneTail(a.to) === mineTail).reverse();
    // Remember each session's contact capability token from its link.
    const tokens = store.get('contact.tokens', {});
    for (const a of mine) {
      const tok = new URL(a.liveSessionLink).searchParams.get('t');
      if (tok) tokens[a.sessionId] = tok;
    }
    store.set('contact.tokens', tokens);
    const seen = new Set();
    const cards = mine.filter((a) => !seen.has(a.sessionId) && seen.add(a.sessionId)).map((a) => `
      <div class="card tap ${a.duress ? 'duress' : ''}" onclick="go('contact/${a.sessionId}')">
        <div class="k">${a.duress ? '⚠ ' + esc(t('ct_alert_duress'))
          : a.watchExpired ? '⏰ ' + esc(t('ct_alert_watch'))
          : a.escalation ? '⏳ ' + esc(t('ct_alert_escalation')) : '🆘 ' + esc(t('ct_alert'))}</div>
        <b>${esc(t('ct_needs_help', { name: a.helpseekerDisplayName }))}</b> · ${esc(catLabel(a.category))}<br>
        <span style="color:var(--dim);font-size:12px">${fmtTime(a.sentAt)}</span></div>`).join('');
    if (cards && cards !== last) { document.getElementById('dyn').innerHTML = cards; last = cards; }
  };
  routeTick();
}
const contactToken = (sid) => store.get('contact.tokens', {})[sid] || '';
// "Last seen" freshness: a stale dot may mean the phone died, not safety.
function freshness(ageMs) {
  if (ageMs == null) return t('fresh_none');
  if (ageMs < 20000) return t('fresh_live');
  const m = Math.floor(ageMs / 60000);
  if (m < 1) return t('fresh_seconds');
  if (m < 60) return t('fresh_min', { m });
  return t('fresh_hour');
}

function renderContactSession(sid) {
  $m.innerHTML = `<div id="dyn"><p class="lead">…</p></div>`;
  let last = '';
  routeTick = async () => {
    const v = await api(`/sessions/${sid}/contact-view?t=${contactToken(sid)}`, undefined, 'GET').catch(() => null);
    if (!v) return;
    const live = ['PENDING', 'ACTIVE', 'DISPATCHED', 'ARRIVED'].includes(v.state);
    const html = `
      ${v.duress ? `<div class="card duress"><div class="k">⚠ ${esc(t('ct_alert_duress'))}</div>${t('ct_duress_box')}</div>` : ''}
      <h1>${esc(v.helpseekerDisplayName || '')} <span class="chip ${v.state}">${esc(t('state_' + v.state))}</span></h1>
      <p class="lead">${esc(catLabel(v.category))}</p>
      ${v.placeNote ? `<div class="card"><div class="k">${esc(t('ct_said'))}</div>${esc(v.placeNote)}</div>` : ''}
      ${v.location ? mapSvg(null, v.location, { dot: true, hideCell: true }) +
        `<p class="lead center">📍 ${esc(freshness(v.locationAgeMs))}</p>
         <a class="bigbtn" style="text-decoration:none;color:inherit" target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query=${v.location.lat},${v.location.lng}"><span class="ic">🗺️</span><b>${esc(t('open_maps'))}</b></a>` :
        `<p class="lead" style="margin-top:20px">${live ? esc(t(v.duress ? 'ct_no_loc_duress' : 'ct_no_loc')) : esc(t('ct_ended'))}</p>`}
      ${v.state === 'ACTIVE' && v.location ? `<button class="primary" onclick="contactDispatch('${sid}')">${esc(t('ct_send_helper'))}</button>` : ''}
      ${v.state === 'DISPATCHED' ? `<p class="lead center" style="margin-top:8px">${esc(t('ct_helper_coming'))}</p>` : ''}
      <button class="subtle" onclick="go('contact')">${esc(t('ct_all_alerts'))}</button>`;
    if (html !== last) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}
async function contactDispatch(sid) {
  try {
    const asked = await api(`/sessions/${sid}/dispatch?t=${contactToken(sid)}`, {});
    if (Array.isArray(asked) && asked.length === 0) toast(t('no_helpers_contact'));
    routeTick();
  } catch (e) { toast(friendlyError(e)); }
}

/* ----------------------------- responder ------------------------------ */
function renderResponderInbox() {
  const rid = store.get('responder.id', null);
  if (!rid) {
    $m.innerHTML = `<h1>${esc(t('rs_who'))}</h1>
      <p class="lead">${esc(t('rs_who_sub'))}</p><div id="dyn"></div>`;
    api('/dev/roster', undefined, 'GET').then((roster) => {
      document.getElementById('dyn').innerHTML = roster.map((r) => `
        <div class="card tap" onclick="store.set('responder.id','${r.id}');store.set('responder.token','${r.devToken}');render()">
          <b>${esc(r.id.replace('responder-', ''))}</b>
          <div style="color:var(--dim);font-size:12px">${r.verified ? esc(t('rs_checked')) : ''}</div></div>`).join('');
    }).catch(() => {});
    return;
  }
  $m.innerHTML = `<h1>${esc(t('rs_offers'))}</h1>
    <p class="lead">${esc(rid.replace('responder-', ''))} · <a href="#" onclick="store.del('responder.id');render();return false">${esc(t('ct_change'))}</a></p>
    <div id="dyn"><p class="lead" style="margin-top:30px">${esc(t('rs_none'))}</p></div>`;
  let last = '';
  routeTick = async () => {
    const ob = await api('/dev/outbox', undefined, 'GET');
    const mine = ob.responderOffers.filter((o) => o.to === rid).reverse();
    const seen = new Set();
    const cards = mine.filter((o) => !seen.has(o.sessionId) && seen.add(o.sessionId)).map((o) => `
      <div class="card tap" onclick="go('responder/${o.sessionId}')">
        <div class="k">🆘 ${esc(t('rs_offer'))}</div>
        <b>${esc(catLabel(o.category))}</b> · ${esc(t('rs_area'))}<br>
        <span style="color:var(--dim);font-size:12px">${fmtTime(o.sentAt)}</span></div>`).join('');
    if (cards && cards !== last) { document.getElementById('dyn').innerHTML = cards; last = cards; }
  };
  routeTick();
}

function renderResponderJob(sid) {
  const rid = store.get('responder.id');
  $m.innerHTML = `<div id="dyn"><p class="lead">…</p></div>`;
  let last = '';
  routeTick = async () => {
    const v = await api(`/sessions/${sid}/responder-view/${rid}`, undefined, 'GET', responderAuth()).catch(() => null);
    if (!v) return;
    const accepted = (store.get('responder.accepted', [])).includes(sid);
    let html = `<h1>${esc(t('rs_offer'))} <span class="chip ${v.state}">${esc(t('state_' + v.state))}</span></h1>
      <p class="lead">${esc(catLabel(v.category))} · ${esc(t('rs_area'))}</p>`;
    if (v.state === 'ACTIVE') {
      html += mapSvg(v.coarseCell, null, {}) + `
        <p class="lead center">${esc(t('rs_area_note'))}</p>
        <button class="primary" onclick="acceptJob('${sid}')">${esc(t('rs_accept'))}</button>`;
    } else if (v.state === 'DISPATCHED' && accepted && v.location) {
      html += mapSvg(v.coarseCell, v.location, { dot: true }) + `
        <p class="lead center"><a href="https://www.google.com/maps/search/?api=1&query=${v.location.lat},${v.location.lng}" target="_blank" rel="noopener">${esc(t('rs_navigate'))}</a></p>
        <label>${esc(t('rs_code_label'))}</label>
        <input id="arr-code" inputmode="numeric" maxlength="6" placeholder="······">
        <button class="primary" onclick="verifyArrival('${sid}')">${esc(t('rs_verify'))}</button>
        <button class="subtle" onclick="withdrawJob('${sid}')">${esc(t('rs_withdraw'))}</button>`;
    } else if (v.state === 'DISPATCHED') {
      html += `<p class="lead" style="margin-top:24px">${esc(t('rs_taken'))}</p>`;
    } else if (v.state === 'ARRIVED') {
      html += `<div class="big-ico">🤝</div><p class="lead center">${esc(t('rs_on_scene'))}</p>`;
    } else if (v.state === 'RESOLVED' || v.state === 'CLOSED' || v.state === 'PURGED') {
      html += `<div class="big-ico">✅</div><p class="lead center">${esc(t('rs_done'))}</p>`;
    } else {
      html += `<p class="lead" style="margin-top:24px">${esc(t('rs_not_available'))}</p>`;
    }
    html += `<button class="subtle" onclick="go('responder')">${esc(t('rs_back'))}</button>`;
    if (html !== last && !typing()) { document.getElementById('dyn').innerHTML = html; last = html; }
  };
  routeTick();
}
async function acceptJob(sid) {
  try {
    await api(`/sessions/${sid}/accept`, { responderId: store.get('responder.id') }, 'POST', responderAuth());
    const a = store.get('responder.accepted', []); a.push(sid); store.set('responder.accepted', a);
    routeTick();
  } catch (e) { toast(friendlyError(e)); }
}
async function verifyArrival(sid) {
  try {
    await api(`/sessions/${sid}/arrival`, { responderId: store.get('responder.id'), code: document.getElementById('arr-code').value }, 'POST', responderAuth());
    routeTick();
  } catch (e) { toast(friendlyError(e)); }
}
async function withdrawJob(sid) {
  try {
    await api(`/sessions/${sid}/withdraw`, { responderId: store.get('responder.id') }, 'POST', responderAuth());
    store.set('responder.accepted', store.get('responder.accepted', []).filter((x) => x !== sid));
    go('responder');
  } catch (e) { toast(friendlyError(e)); }
}

render();
// Reference data (country list, helplines) arrives async; re-render once it
// lands so the country picker and helpline cards populate.
refReady.then(() => { if (!typing()) render(); });
cfgReady.then(() => { if (!typing()) render(); });
</script>
