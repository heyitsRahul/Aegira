<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Aegira demo</title>
<meta name="description" content="A one-minute, narrated walkthrough of Aegira: SOS, family alert, a trained helper, the secret PIN and SMS on a basic phone. Simulated: nothing is sent.">
<style>
  /* No web fonts on purpose: a privacy-first app should not hand visitors' IPs to a font CDN. */
  :root{
    --paper:#f2ede3;--ink:#1c1a17;--ink2:#635b50;--rule:#d8cfbf;--red:#c9381f;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Kohinoor Devanagari","Noto Serif Devanagari",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    /* inside the phones: the app's own dark screen */
    --s-bg:#0f0e0c;--s-card:#1e1c19;--s-line:#34302b;--s-ink:#f3efe8;--s-dim:#9a9184;
    --s-red:#ff5236;--s-green:#4cb878;--s-blue:#5b9bff;--s-amber:#f0a83a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);padding-bottom:56px}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
  button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}

  .strip{display:block;background:var(--ink);color:var(--paper);text-align:center;font:500 11.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;text-decoration:none}
  .strip b{color:#ff8b74;font-weight:600}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{display:flex;align-items:baseline;gap:16px;padding:22px 0 18px;border-bottom:1px solid var(--rule)}
  .logo{font:600 25px/1 var(--serif);text-decoration:none;letter-spacing:-.01em}
  .logo i{color:var(--red);font-style:normal}
  header nav{margin-left:auto;display:flex;gap:22px;font-size:14px}
  header nav a{color:var(--ink2);text-decoration:none}
  header nav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

  .intro{padding:48px 0 40px}
  .kicker{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:18px}
  h1{font:400 clamp(34px,5.2vw,58px)/1.06 var(--serif);letter-spacing:-.022em;max-width:14em;text-wrap:balance}
  .sub{color:var(--ink2);font-size:17px;max-width:33em;margin-top:18px}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin-top:30px}
  .play{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding:15px 26px 15px 22px;border-radius:6px;font-weight:600;font-size:16px}
  .play:hover{background:#000}
  .play .ic{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
  .play.on .ic{width:11px;height:11px;border:0;background:currentColor;border-radius:1px}
  .link{font-size:14px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:5px;padding:8px 0}
  .link:hover{color:var(--ink);text-decoration-color:currentColor}

  .stage{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;justify-items:center;padding:44px 0 32px;border-top:1px solid var(--rule)}
  .slot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .4s,filter .4s}
  .slot.dim{opacity:.36;filter:saturate(.2)}
  figcaption{margin-top:18px;text-align:center}
  figcaption b{display:block;font:400 20px/1.2 var(--serif)}
  figcaption span{font:12px/1.5 var(--mono);color:var(--ink2);letter-spacing:.03em}

  /* phones */
  .phone{width:256px;height:520px;background:#1d1b18;border-radius:44px;padding:9px;position:relative;
    box-shadow:0 0 0 1px #000,inset 0 0 0 1.5px #45403a,0 50px 60px -45px rgba(70,45,20,.6)}
  .glass{height:100%;border-radius:36px;background:var(--s-bg);color:var(--s-ink);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .glass::before{content:"";position:absolute;top:10px;left:50%;width:78px;height:22px;margin-left:-39px;background:#000;border-radius:12px;z-index:2}
  .sbar{display:flex;justify-content:space-between;align-items:center;height:42px;padding:12px 24px 0 28px;font:600 12px/1 var(--sans);flex:none}
  .sig{display:flex;gap:2px;align-items:flex-end;height:10px}
  .sig i{width:3px;background:var(--s-ink);border-radius:1px}
  .screen{flex:1;min-height:0;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.4}
  .shake{animation:shake .5s}
  @keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

  .phone.basic{width:212px;height:auto;border-radius:30px 30px 46px 46px;background:#2b2824;padding:22px 18px 22px}
  .phone.basic .glass{height:250px;border-radius:5px;background:#c1cbad;color:#1f2a14;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
  .phone.basic .glass::before,.phone.basic .sbar{display:none}
  .phone.basic .screen{padding:10px;gap:6px;font:12.5px/1.35 var(--mono)}
  .phone.basic hr{border:0;border-top:1px dashed #74805e}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
  .keys span{background:#3a3631;border-radius:9px;height:30px;display:grid;place-items:center;color:#b5ab9c;font:12px var(--mono)}

  /* the app's screens */
  .app{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--s-dim)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .h{font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
  .m{font-size:15.5px;font-weight:650}
  .d{font-size:12.5px;color:var(--s-dim)}
  .c{text-align:center}
  .grow{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .sos{position:relative;margin:auto;width:158px;height:158px;border-radius:50%;background:var(--s-red);color:#fff;display:grid;place-items:center;font:800 36px/1 var(--sans);letter-spacing:.04em;transition:transform .15s}
  .sos::before,.sos::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1px solid rgba(255,82,54,.4)}
  .sos::after{inset:-28px;border-color:rgba(255,82,54,.16)}
  .sos.press{transform:scale(.94)}
  .sos.press::before,.sos.press::after{animation:ring 1s ease-out infinite}
  @keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.3);opacity:0}}
  .count{font:200 100px/1 var(--sans);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.05em;margin:4px 0}
  .cells{display:flex;gap:6px;justify-content:center}
  .cells span{width:32px;height:42px;border-radius:9px;background:var(--s-card);border:1px solid var(--s-line);display:grid;place-items:center;font:600 18px/1 var(--mono)}
  .cells span.f{border-color:#8a8174}
  .cells.code span{width:30px;font-size:21px;color:var(--s-ink)}
  .btn{border-radius:14px;padding:13px;text-align:center;font-weight:650;font-size:15px;background:var(--s-card);border:1px solid var(--s-line)}
  .btn.red{background:var(--s-red);border-color:var(--s-red);color:#fff}
  .btn.green{background:var(--s-green);border-color:var(--s-green);color:#06140b}
  .btn.ghost{background:none}
  .btn.tap{animation:tap .4s}
  @keyframes tap{50%{transform:scale(.95);filter:brightness(1.25)}}
  .track{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .track span{font-size:11px;color:var(--s-dim);border-top:3px solid var(--s-line);padding-top:6px}
  .track span.on{border-color:var(--s-green);color:var(--s-ink)}
  .map{height:148px;border-radius:14px;overflow:hidden;flex:none}
  .note{background:rgba(52,48,43,.94);border-radius:16px;padding:10px 12px;font-size:12.5px;line-height:1.38;animation:drop .4s}
  .note .top{display:flex;justify-content:space-between;font-size:11px;color:var(--s-dim);margin-bottom:3px;font-weight:600}
  .note.alarm{background:#3d130c;box-shadow:inset 3px 0 0 var(--s-red)}
  .note.alarm .top{color:#ffa391}
  .note.flat{animation:none}
  @keyframes drop{from{transform:translateY(-24px);opacity:0}}
  .tag{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);color:var(--s-dim);border:1px solid var(--s-line);border-radius:6px;padding:5px 7px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--s-green);display:inline-block;flex:none}
  .dot.red{background:var(--s-red)}
  .pulse{animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .clock{font:200 66px/1 var(--sans);text-align:center;letter-spacing:-.03em;margin-top:22px}
  .notes{margin-top:22px;display:flex;flex-direction:column;gap:8px}
  .check path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .radar{width:92px;height:92px;border-radius:50%;border:1px solid var(--s-line);display:grid;place-items:center;position:relative}
  .radar::before{content:"";position:absolute;inset:20px;border-radius:50%;border:1px solid var(--s-line)}
  .vault{width:100%;border:1px solid var(--s-line);border-radius:12px;padding:6px 12px;font:11.5px/1 var(--mono)}
  .vault div{display:flex;justify-content:space-between;padding:8px 0;position:relative;animation:fade .3s forwards}
  .vault div+div{border-top:1px solid var(--s-line)}
  .vault span{color:var(--s-dim)}
  .vault div::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--s-red);transform:scaleX(0);transform-origin:left;animation:strike .35s forwards}
  .vault div:nth-child(1),.vault div:nth-child(1)::after{animation-delay:.2s}
  .vault div:nth-child(2),.vault div:nth-child(2)::after{animation-delay:.45s}
  .vault div:nth-child(3),.vault div:nth-child(3)::after{animation-delay:.7s}
  .vault div:nth-child(4),.vault div:nth-child(4)::after{animation-delay:.95s}
  @keyframes strike{to{transform:scaleX(1)}}
  @keyframes fade{to{opacity:.4}}

  /* subtitles and chapters */
  .caption{text-align:center;padding:4px 0 8px;min-height:124px}
  .chap{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red);min-height:12px;margin-bottom:14px}
  #cap{font:400 clamp(20px,2.5vw,28px)/1.34 var(--serif);max-width:28em;margin:0 auto;text-wrap:balance}
  .timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:22px;padding-top:22px;border-top:1px solid var(--rule)}
  .seg{text-align:left;color:var(--ink2)}
  .seg .bar{display:block;height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:11px}
  .seg .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s}
  .seg.now{color:var(--ink)}
  .seg.now .bar i{background:var(--red)}
  .seg:hover{color:var(--ink)}
  .seg .n{display:block;font:500 11px/1 var(--mono);letter-spacing:.08em;margin-bottom:5px}
  .seg .l{display:block;font-size:13.5px;line-height:1.3}
  .end{margin-top:36px;color:var(--ink2);font-size:15px}
  .end a{color:var(--ink);text-underline-offset:4px}

  /* Monospace spaces Devanagari badly; Hindi labels use the sans face. */
  html[lang=hi] :is(.kicker,.chap,figcaption span,.tag,.vault span){font-family:var(--sans);letter-spacing:0}

  @media (max-width:820px){
    .intro{padding:30px 0 28px}
    .sub{font-size:16px}
    .stage{grid-template-columns:1fr;padding:28px 0 12px}
    /* One phone at a time on small screens: the one the story is on. */
    .slot.dim,.slot.sec{display:none}
    .phone{height:452px}
    .caption{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--rule);margin:0 -20px;padding:14px 20px 16px;min-height:0}
    .chap{margin-bottom:8px}
    #cap{font-size:19px}
    .timeline{grid-template-columns:repeat(3,1fr);gap:16px 12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.check path{stroke-dashoffset:0}}
</style>
</head>
<body>
<a class="strip" href="tel:112">Demo only. Not a real emergency service. In danger, call <b>112</b></a>
<div class="wrap">
  <header>
    <a class="logo" href="/">aegira<i>.</i></a>
    <nav><a href="/app">Try it yourself</a><a href="/guide">How to use</a></nav>

  <section class="intro">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>

      <button class="play" id="play" onclick="togglePlay()"></button>
      <button class="link" id="snd" aria-pressed="true" onclick="toggleSound()"></button>
      <button class="link" id="lang" onclick="toggleLang()"></button>

  </section>

  <div class="stage" id="stage">
    <figure class="slot" id="slot-meera"><div class="phone" id="ph-meera"><div class="glass"><div class="sbar">9:42<span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span></div><div class="screen" id="meera"></div></div></div><figcaption id="who-meera"></figcaption></figure>
    <figure class="slot" id="slot-arjun"><div class="phone" id="ph-arjun"><div class="glass"><div class="sbar">9:42<span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span></div><div class="screen" id="arjun"></div></div></div><figcaption id="who-arjun"></figcaption></figure>
    <figure class="slot" id="slot-asha"><div class="phone" id="ph-asha"><div class="glass"><div class="sbar">9:42<span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span></div><div class="screen" id="asha"></div></div></div><figcaption id="who-asha"></figcaption></figure>
  </div>

  <div class="caption" role="status" aria-live="polite"><p class="chap" id="chap-name"></p><p id="cap"></p></div>
  <nav class="timeline" id="chapters" aria-label="Chapters"></nav>
  <p class="end" id="endnote"></p>
</div>

      offer: 'किसी को मदद चाहिए', alias: 'helpseeker-3f9a', area: 'लगभग 1 km', noName: 'न नाम, न फ़ोन नंबर।',
      accept: 'स्वीकार करें', exact: 'सही जगह, स्वीकार करने के बाद ही', askCode: 'उनसे कोड पूछें', withThem: 'आप उनके साथ हैं',
      idle: 'ड्यूटी पर', idleSub: 'पास में किसी को मदद चाहिए, तभी आपसे पूछा जाता है।',
      vault: [['जगह', '12.97, 77.59'], ['रास्ता', '14 बिंदु'], ['संपर्क', '1 व्यक्ति'], ['चाबी', 'k_3f9a 77b0']],
      basicSos: 'SOS near Andheri station gate 2',
      basicReply: 'Aegira: Help is starting. Cancel within 30 sec: CANCEL and your PIN.',

    },
    lines: [
      ['यह मीरा है। रात को घर लौट रही है, और कोई उसका पीछा कर रहा है।', 'वह Aegira खोलकर SOS दबाती है।'],
      ['ग़लती से दबा हो, तो उसके पास PIN से रद्द करने के लिए तीस सेकंड हैं।', 'समय पूरा। उसके भाई अर्जुन को संदेश जाता है, साथ में उसकी जगह का लिंक।', 'वह लिंक खोलकर नक्शे पर उसे देखता है, और प्रशिक्षित सहायक भेजता है।'],
      ['पास की प्रशिक्षित सहायक आशा को अनुरोध मिलता है। उसे न नाम दिखता है, न फ़ोन नंबर। सिर्फ़ एक उपनाम, और लगभग एक किलोमीटर का इलाका।', 'वह स्वीकार करती है। अब जाकर उसे सही जगह दिखती है।', 'मीरा के फ़ोन पर एक कोड आता है।', 'आशा पहुँचकर कोड पूछती है। अब मीरा जानती है कि सही व्यक्ति आया है।'],
      ['मीरा सुरक्षित है। वह PIN डालकर दबाती है: मैं सुरक्षित हूँ।', 'और उसकी जगह की जानकारी मिट जाती है। उसे पढ़ने वाली इकलौती चाबी नष्ट कर दी जाती है।'],
      ['अब मुश्किल हालात। कोई मीरा का फ़ोन छीनकर उसे रद्द करने पर मजबूर करता है।', 'वह असली की जगह गुप्त PIN डालती है।', 'फ़ोन पर रद्द लिखा आता है। पास खड़े व्यक्ति को कुछ अलग नहीं दिखता।', 'पर अर्जुन को गुप्त अलार्म जाता है: उसे कॉल मत करो, कोई उसके साथ हो सकता है। और मदद आती रहती है।', 'फ़ोन झूठ बोलता है। जानबूझकर।'],
      ['स्मार्टफ़ोन नहीं, या इंटरनेट नहीं? मीरा किसी भी सादे फ़ोन से SOS का SMS भेज सकती है।', 'उसके अपनों को फिर भी सूचना मिलती है, उसके अपने शब्दों में जगह के साथ।', 'यह है Aegira. ख़ुद आज़माएँ, PIN 1 2 3 4 से, या गुप्त PIN 9 9 9 9 से।'],
    ],
  },
};
let lang = 'en';
const L = () => T[lang];
const $ = (id) => document.getElementById(id);

// ---------- sound (Web Audio; no files to load) ----------
let soundOn = true, audio = null;
function ctx() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); return audio; }
function tone(freq, start, dur, type = 'sine', vol = 0.15) {
  if (!soundOn) return;
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + 0.05);
}
const sfx = {
  tap: () => tone(600, 0, 0.06, 'square', 0.06),
  alarm: () => { for (let i = 0; i < 3; i++) { tone(880, i * 0.32, 0.15, 'sawtooth', 0.08); tone(660, i * 0.32 + 0.16, 0.15, 'sawtooth', 0.08); } },
  tick: () => tone(1000, 0, 0.04, 'square', 0.05),
  sms: () => { tone(1318, 0, 0.12); tone(1760, 0.14, 0.18); },
  alarmSoft: () => { tone(520, 0, 0.25, 'triangle', 0.12); tone(520, 0.3, 0.25, 'triangle', 0.12); tone(520, 0.6, 0.25, 'triangle', 0.12); },
  chime: () => { tone(523, 0, 0.3); tone(659, 0.12, 0.3); tone(784, 0.24, 0.45); },
  shred: () => {
    if (!soundOn) return;
    const a = ctx(), len = a.sampleRate * 0.5, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), g = a.createGain(); g.gain.value = 0.12;
    s.buffer = buf; s.connect(g).connect(a.destination); s.start();
    tone(400, 0.05, 0.4, 'sine', 0.1); tone(200, 0.25, 0.4, 'sine', 0.1);
  },
};

// ---------- narration (speechSynthesis) ----------
function pickVoice(code) {
  const vs = speechSynthesis.getVoices();
  return vs.find((v) => v.lang === code) || vs.find((v) => v.lang.startsWith(code.slice(0, 2))) || null;
}
function speak(text) {
  return new Promise((resolve) => {
    if (!soundOn || !('speechSynthesis' in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    const v = pickVoice(u.lang); if (v) u.voice = v;
    u.rate = 1.0;
    let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 3000 + text.length * 110); // some browsers never fire onend
    speechSynthesis.speak(u);
  });
}

// ---------- the player ----------
let run = 0, playing = false, chapter = 0, lineNo = 0;
const totalLines = () => L().lines.reduce((n, c) => n + c.length, 0);
class Stop extends Error {}
// Stopping mid-line rejects a narration nobody awaits any more; that is expected.
window.addEventListener('unhandledrejection', (e) => { if (e.reason instanceof Stop) e.preventDefault(); });
function alive(my) { if (my !== run) throw new Stop(); }
function sleep(ms, my) { return new Promise((res, rej) => setTimeout(() => (my === run ? res() : rej(new Stop())), ms)); }
// Each chapter's bar fills line by line.
function paintTimeline() {
  let before = 0;
  document.querySelectorAll('.seg').forEach((el, i) => {
    const len = L().lines[i].length;
    el.querySelector('i').style.width = Math.max(0, Math.min(1, (lineNo - before) / len)) * 100 + '%';
    before += len;
  });
}
async function say(my, c, i) {
  alive(my);
  const text = L().lines[c][i];
  $('cap').textContent = text;
  lineNo++; paintTimeline();
  const t0 = Date.now();
  await speak(text);
  alive(my);
  const min = 1200 + text.split(/\s+/).length * 260; // reading time when muted
  const left = (soundOn ? 500 : min) - (Date.now() - t0);
  if (left > 0) await sleep(left, my);
}
// The first phone named is where the story is; on small screens it is the
// only one shown.
function focus(...who) {
  for (const w of ['meera', 'arjun', 'asha']) {
    $('slot-' + w).classList.toggle('dim', !who.includes(w));
    $('slot-' + w).classList.toggle('sec', who.includes(w) && who[0] !== w);
  }
}
function shake(w) { const p = $('ph-' + w); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
function tapEl(sel) { const e = document.querySelector(sel); if (e) { e.classList.remove('tap'); void e.offsetWidth; e.classList.add('tap'); sfx.tap(); } }

// ---------- screens ----------
function map(mode) {
  // mode: 'dot' exact spot, 'area' ~1 km circle only, 'none'
  const base = '<rect width="250" height="160" fill="#191815"/>' +
    '<path d="M-10 128C60 108 92 150 160 126S236 98 262 110V170H-10Z" fill="#15202a"/>' +
    '<rect x="166" y="12" width="62" height="46" rx="5" fill="#1b251c"/>' +
    '<path d="M0 40H250M0 92H250M58 0V160M138 0V160M204 0V160" stroke="#2b2824" stroke-width="6"/>' +
    '<path d="M0 116L250 20" stroke="#3b3630" stroke-width="10"/>';
  const dot = '<circle cx="138" cy="86" r="16" fill="rgba(91,155,255,.25)" class="pulse"/><circle cx="138" cy="86" r="7" fill="#5b9bff" stroke="#fff" stroke-width="2"/>';
  const area = '<circle cx="128" cy="80" r="52" fill="rgba(240,168,58,.1)" stroke="#f0a83a" stroke-dasharray="5 4"/>';
  return `<div class="map"><svg viewBox="0 0 250 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${base}${mode === 'dot' ? dot : mode === 'area' ? area : ''}</svg></div>`;
}
// PIN and code boxes; `value` is what has been typed so far.
function cells(value, n, cls = '') {
  return `<div class="cells ${cls}">${Array.from({ length: n }, (_, i) => `<span class="${value[i] ? 'f' : ''}">${value[i] ?? ''}</span>`).join('')}</div>`;
}
const lockIcon = '<svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><rect x=".5" y="5" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M2.5 5V3.6a2.5 2.5 0 015 0V5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
const checkIcon = '<svg class="check" width="64" height="64" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="#4cb878" stroke-width="2"/><path d="M15 27l7 7 15-16" fill="none" stroke="#4cb878" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const U = () => L().ui;
const S = {
  meeraHome: () => `<div class="app">aegira</div><div class="h c" style="margin-top:10px">${U().need}</div><div class="sos" id="sosbtn">SOS</div><div class="d c">${U().press}</div>`,
  meeraCount: (n, pin = '') => `<div class="app">aegira</div><div class="d c" style="margin-top:6px">${U().starts}</div><div class="count">${n}</div><div class="d">${U().cancelPin}</div>${cells(pin, 4)}<div class="btn ghost" id="m-cancel">${U().cancel}</div>`,
  meeraLive: (step, extra = '') => `<div class="row"><span class="m">${U().coming}</span><span class="tag"><i class="dot red pulse"></i>${U().live}</span></div>
    <div class="track"><span class="on">${U().s1}</span><span class="${step >= 2 ? 'on' : ''}">${U().s2}</span><span class="${step >= 3 ? 'on' : ''}">${U().s3}</span></div>
    ${map('dot')}${extra}`,
  meeraSafeForm: (pin = '') => `<div class="d">${U().yourPin}</div>${cells(pin, 4)}<div class="btn green" id="m-safe">${U().safeBtn}</div>`,
  meeraSafe: () => `<div class="grow">${checkIcon}<div class="h">${U().safe}</div><div class="d">${U().safeSub}</div></div>`,
  meeraDeleted: () => `<div class="grow"><div class="vault">${U().vault.map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join('')}</div><div class="m" style="margin-top:6px">${U().deleted}</div></div>`,
  meeraCancelled: () => `<div class="app">aegira</div><div class="grow"><div class="h">${U().cancelled}</div><div class="d">${U().nobody}</div></div>`,
  lock: (notif = '') => `<div class="clock">9:42</div><div class="d c">${U().lock}</div><div class="notes">${notif}</div>`,
  arjunNotif: (secret) => `<div class="note ${secret ? 'alarm' : ''}"><div class="top"><span>${U().sms}</span><span>${U().now}</span></div>${secret ? U().secret : U().alert}</div>`,
  arjunView: (asked, secret) => `<div class="app">aegira</div><div class="row"><span class="m">${U().needsHelp}</span><span class="tag"><i class="dot red pulse"></i>${U().live}</span></div>
    ${secret ? `<div class="note alarm flat">${U().secretBox}</div>` : ''}${map('dot')}
    <div class="btn ${asked ? '' : 'red'}" id="a-send">${asked ? U().asked : U().send}</div>`,
  ashaIdle: () => `<div class="app">aegira · helper</div><div class="grow"><div class="radar"><i class="dot pulse"></i></div><div class="m">${U().idle}</div><div class="d">${U().idleSub}</div></div>`,
  ashaOffer: () => `<div class="app">aegira · helper</div><div class="m">${U().offer}</div><div class="row" style="justify-content:flex-start"><span class="tag">${U().alias}</span><span class="tag">${U().area}</span></div>
    ${map('area')}<div class="d" style="display:flex;gap:6px;align-items:center">${lockIcon}${U().noName}</div><div class="btn red" id="h-accept">${U().accept}</div>`,
  ashaAccepted: (code = '', ok = false) => `<div class="app">aegira · helper</div><div class="d">${U().exact}</div>${map('dot')}
    <div class="d">${U().askCode}</div>${cells(code, 6, 'code')}${ok ? `<div class="btn green">${U().withThem}</div>` : ''}`,
  basic: (msgs) => `<div><b>Messages</b></div>${msgs.map((m) => `<div>${m}</div>`).join('<hr>')}`,
};
function show(w, html) { $(w).innerHTML = html; }
function setBasic(on) { $('ph-meera').classList.toggle('basic', on); const k = $('ph-meera').querySelector('.keys'); if (on && !k) $('ph-meera').insertAdjacentHTML('beforeend', '<div class="keys">' + '123456789*0#'.split('').map((c) => `<span>${c}</span>`).join('') + '</div>'); if (!on && k) k.remove(); }
async function typeInto(w, render, text, my) { let s = ''; for (const ch of text) { s += ch; show(w, render(s)); sfx.tap(); await sleep(170, my); } }

// ---------- chapters ----------
const CODE = '482913';
const CHAPTERS = [
  async (my) => {
    setBasic(false); show('meera', S.meeraHome()); show('arjun', S.lock()); show('asha', S.ashaIdle()); focus('meera');
    await say(my, 0, 0);
    $('sosbtn').classList.add('press'); sfx.alarm(); shake('meera'); await sleep(500, my);
    show('meera', S.meeraCount(30));
    await say(my, 0, 1);
  },
  async (my) => {
    focus('meera'); show('meera', S.meeraCount(30)); show('arjun', S.lock()); show('asha', S.ashaIdle());
    const speech = say(my, 1, 0);
    for (let n = 30; n >= 0; n -= 3) { show('meera', S.meeraCount(n)); sfx.tick(); await sleep(230, my); }
    await speech;
    show('meera', S.meeraLive(1)); focus('arjun', 'meera');
    sfx.sms(); shake('arjun'); show('arjun', S.lock(S.arjunNotif(false)));
    await say(my, 1, 1);
    show('arjun', S.arjunView(false, false)); await sleep(400, my); tapEl('#a-send'); await sleep(300, my);
    show('arjun', S.arjunView(true, false));
    await say(my, 1, 2);
  },
  async (my) => {
    show('meera', S.meeraLive(1)); show('arjun', S.arjunView(true, false)); focus('asha');
    sfx.sms(); shake('asha'); show('asha', S.ashaOffer());
    await say(my, 2, 0);
    tapEl('#h-accept'); await sleep(350, my); show('asha', S.ashaAccepted()); sfx.chime();
    await say(my, 2, 1);
    focus('meera'); show('meera', S.meeraLive(2, `<div class="d c">${U().showCode}</div>${cells(CODE, 6, 'code')}`));
    await say(my, 2, 2);
    focus('asha', 'meera');
    const speech = say(my, 2, 3);
    await typeInto('asha', (c) => S.ashaAccepted(c), CODE, my);
    show('asha', S.ashaAccepted(CODE, true)); sfx.chime();
    show('meera', S.meeraLive(3, `<div class="note flat" style="display:flex;gap:8px;align-items:center"><i class="dot"></i>${U().helperHere}</div>`));
    await speech;
    focus('meera', 'asha');
  },
  async (my) => {
    focus('meera'); show('asha', S.ashaAccepted(CODE, true)); show('arjun', S.arjunView(true, false));
    const live = (pin) => S.meeraLive(3, S.meeraSafeForm(pin));
    show('meera', live(''));
    const speech = say(my, 3, 0);
    await typeInto('meera', live, '••••', my); tapEl('#m-safe'); await sleep(300, my);
    show('meera', S.meeraSafe()); sfx.chime();
    await speech;
    show('meera', S.meeraDeleted()); sfx.shred(); show('arjun', S.lock()); show('asha', S.ashaIdle()); focus('meera', 'arjun', 'asha');
    await say(my, 3, 1);
  },
  async (my) => {
    setBasic(false); focus('meera'); show('arjun', S.lock()); show('asha', S.ashaIdle());
    show('meera', S.meeraCount(24));
    await say(my, 4, 0);
    shake('meera');
    const speech = say(my, 4, 1);
    await typeInto('meera', (p) => S.meeraCount(24, p), '••••', my); tapEl('#m-cancel');
    await speech;
    show('meera', S.meeraCancelled());
    await say(my, 4, 2);
    focus('arjun', 'meera'); sfx.alarmSoft(); shake('arjun'); show('arjun', S.lock(S.arjunNotif(true)));
    await say(my, 4, 3);
    show('arjun', S.arjunView(false, true));
    await say(my, 4, 4);
  },
  async (my) => {
    setBasic(true); focus('meera'); show('arjun', S.lock()); show('asha', S.ashaIdle());
    show('meera', S.basic([]));
    const speech = say(my, 5, 0);
    await typeInto('meera', (t) => S.basic(['&gt; ' + t]), U().basicSos, my);
    await speech;
    sfx.sms(); show('meera', S.basic(['&gt; ' + U().basicSos, U().basicReply]));
    focus('arjun', 'meera'); shake('arjun'); show('arjun', S.lock(`<div class="note"><div class="top"><span>${U().sms}</span><span>${U().now}</span></div>${U().basicAlert}</div>`));
    await say(my, 5, 1);
    await say(my, 5, 2);
  },
];

const two = (n) => String(n).padStart(2, '0');
function renderChrome() {
  document.documentElement.lang = lang;
  $('kicker').textContent = L().kicker; $('title').textContent = L().title; $('subtitle').textContent = L().subtitle;
  $('play').innerHTML = `<i class="ic"></i>${playing ? L().stop : L().play}`; $('play').classList.toggle('on', playing);
  $('snd').textContent = soundOn ? L().sndOn : L().sndOff;
  $('lang').textContent = L().other;
  for (const w of ['meera', 'arjun', 'asha']) $('who-' + w).innerHTML = `<b>${L().who[w][0]}</b><span>${L().who[w][1]}</span>`;
  $('chapters').innerHTML = L().chapters.map((c, i) => `<button class="seg ${i === chapter && playing ? 'now' : ''}" onclick="playFrom(${i})"><span class="bar"><i></i></span><span class="n">${two(i + 1)}</span><span class="l">${c}</span></button>`).join('');
  paintTimeline();
  $('endnote').innerHTML = L().end;
}
function reset() {
  setBasic(false); show('meera', S.meeraHome()); show('arjun', S.lock()); show('asha', S.ashaIdle()); focus('meera', 'arjun', 'asha');
  lineNo = 0; paintTimeline();
  $('cap').textContent = L().hint; $('chap-name').textContent = '';
}
async function playFrom(start) {
  run++; const my = run;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (soundOn) ctx().resume();
  playing = true; setBasic(false); // only the last chapter uses the basic phone
  lineNo = L().lines.slice(0, start).reduce((n, c) => n + c.length, 0);
  try {
    for (chapter = start; chapter < CHAPTERS.length; chapter++) {
      renderChrome(); $('chap-name').textContent = `${two(chapter + 1)} / ${two(CHAPTERS.length)} · ${L().chapters[chapter]}`;
      await CHAPTERS[chapter](my);
      await sleep(600, my);
    }
    playing = false; lineNo = totalLines(); renderChrome();
  } catch (e) {
    if (!(e instanceof Stop)) throw e;
  }
}
function stopAll() { run++; playing = false; if ('speechSynthesis' in window) speechSynthesis.cancel(); renderChrome(); }
function togglePlay() { if (playing) stopAll(); else playFrom(0); }
function toggleSound() {
  soundOn = !soundOn; $('snd').setAttribute('aria-pressed', String(soundOn));
  if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  renderChrome();
}
function toggleLang() { const was = playing ? chapter : -1; stopAll(); lang = lang === 'en' ? 'hi' : 'en'; renderChrome(); if (was >= 0) playFrom(was); else reset(); }

if ('speechSynthesis' in window) speechSynthesis.getVoices(); // warm the voice list
if (/^hi/.test(navigator.language || '') || new URLSearchParams(location.search).get('lang') === 'hi') lang = 'hi';
renderChrome(); reset();
</script>
